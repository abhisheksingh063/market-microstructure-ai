[project]
name = "market-microstructure-simulator"
version = "0.1.0"
description = "Multi-Agent Market Microstructure & Execution Strategy Simulator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.0",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.22.0",
    "gymnasium>=0.29.0",
    "torch>=2.3.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
